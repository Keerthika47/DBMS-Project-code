<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Plant</title>
</head>
<body>
    <h2>Update Plant</h2>
    <form method="POST">
        <label for="name">Plant Name:</label>
        <input type="text" id="name" name="name" value="{{ plant['Name'] }}" required><br>

        <label for="category">Category:</label>
        <input type="text" id="category" name="category" value="{{ plant['Category'] }}" required><br>

        <label for="price">Price:</label>
        <input type="number" step="0.01" id="price" name="price" value="{{ plant['Price'] }}" required><br>

        <label for="stock">Stock:</label>
        <input type="number" id="stock" name="stock" value="{{ plant['Stock'] }}" required><br>

        <input type="submit" value="Update">
    </form>
</body>
</html>
