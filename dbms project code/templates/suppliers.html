<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4fff4;
    color: #333;
    margin: 20px;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #2e8b57;
    margin-bottom: 30px;
}

a {
    color: #2e8b57;
    text-decoration: none;
    font-weight: bold;
    margin-right: 15px;
}

a:hover {
    text-decoration: underline;
}

table {
    width: 100%;
    border-collapse: collapse;
    background-color: #ffffff;
    margin-top: 20px;
}

th, td {
    border: 1px solid #ccc;
    padding: 12px;
    text-align: center;
}

th {
    background-color: #c8e6c9;
    color: #2e8b57;
}

tr:nth-child(even) {
    background-color: #f0fdf4;
}

tr:hover {
    background-color: #e0ffe0;
}

    </style>
    <title>Suppliers</title>
</head>
<body>
    <h1>Suppliers List</h1>
    <a href="/add_supplier">Add New Supplier</a> |
    <a href="/">Home</a>

    <table border="1" cellpadding="10">
    <tr>
        <th>Supplier ID</th>
        <th>Name</th>
        <th>Address</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    {% for supplier in suppliers %}
    <tr>
        <td>{{ supplier.SupplierID }}</td>
        <td>{{ supplier.Name }}</td>
        <td>{{ supplier.Address }}</td>
        <td>{{ supplier.Phone }}</td>
        <td>{{ supplier.Email }}</td>
        <td>
            <a href="/update_supplier/{{ supplier.SupplierID }}">Edit</a> |
            <a href="/delete_supplier/{{ supplier.SupplierID }}" onclick="return confirm('Are you sure you want to delete this supplier?');">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
