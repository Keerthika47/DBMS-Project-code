<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Green Nursery - Home</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f8f5;
        margin: 0;
        padding: 0;
        color: #333;
      }
      .container {
        max-width: 800px;
        margin: auto;
        text-align: center;
        padding: 60px 20px;
      }
      h1 {
        color: #2b7a3c;
        font-size: 3em;
        margin-bottom: 10px;
      }
      p {
        font-size: 1.2em;
        margin-bottom: 30px;
      }
      .nav {
        margin-top: 30px;
      }
      .nav a {
        display: inline-block;
        padding: 12px 20px;
        margin: 10px;
        background-color: #3cb371;
        color: white;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        transition: background 0.3s;
      }
      .nav a:hover {
        background-color: #2e8b57;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome to Green Nursery</h1>
      <p>Your one-stop solution for plant shop management.</p>
      <div class="nav">
        <a href="/dashboard">Go to Dashboard</a>
        <a href="/plants">View Plants</a>
      </div>
    </div>
  </body>
</html>
