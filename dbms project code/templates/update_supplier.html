<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Supplier</title>
</head>
<body>
    <h2>Update Supplier</h2>
    <form method="POST">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" value="{{ supplier['Name'] }}" required><br>

        <label for="address">Address:</label>
        <input type="text" name="address" id="address" value="{{ supplier['Address'] }}" required><br>

        <label for="phone">Phone:</label>
        <input type="text" name="phone" id="phone" value="{{ supplier['Phone'] }}" required><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" value="{{ supplier['Email'] }}" required><br>

        <input type="submit" value="Update">
    </form>
</body>
</html>
