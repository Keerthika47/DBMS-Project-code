<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Green Nursery | Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #eafaf1, #d4f4dd);
      color: #2e4a32;
    }

    header {
      background-color: #2e8b57;
      padding: 25px 0;
      text-align: center;
      color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    header h1 {
      margin: 0;
      font-size: 2.7em;
    }

    main {
      max-width: 1200px;
      margin: 40px auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .section-title {
      font-size: 2em;
      color: #2e8b57;
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 80px;
      height: 4px;
      background-color: #2e8b57;
      margin: 10px auto 0;
      border-radius: 2px;
    }

    .nav-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      margin-top: 20px;
    }

    .nav-grid a {
      background-color: #3cb371;
      color: white;
      text-decoration: none;
      padding: 18px 30px;
      border-radius: 12px;
      font-size: 18px;
      min-width: 200px;
      text-align: center;
      transition: 0.3s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    .nav-grid a:hover {
      background-color: #2e8b57;
      transform: translateY(-4px);
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 50px;
      background-color: #f1f1f1;
      color: #666;
      font-size: 14px;
    }

    @media screen and (max-width: 600px) {
      .nav-grid a {
        font-size: 16px;
        padding: 14px 20px;
        min-width: 160px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🌿 Green Nursery Dashboard</h1>
  </header>

  <main>
    <div class="section-title">Navigate Your Nursery</div>
    <div class="nav-grid">
      <a href="/">Home</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/plants">View Plants</a>
      <a href="/add_plant">Add Plant</a>
      <a href="/customers">Customers</a>
      <a href="/add_customer">Add Customer</a>
      <a href="/suppliers">Suppliers</a>
      <a href="/add_supplier">Add Supplier</a>
      <a href="/take_order">Take Order</a>
      <a href="/orders">Orders</a>
      <a href="/order_details">Order Details</a>
    </div>
  </main>

  <footer>&copy; 2025 Green Nursery | Plant Shop Management System</footer>
</body>
</html>
